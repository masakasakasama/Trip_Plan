<!doctype html><meta charset="utf-8"><title>Trip OS visual smoke</title><style>body{font-family:system-ui;background:#111;color:#fff}iframe{width:1280px;height:900px;border:0}</style><div id="result">RUNNING</div><iframe id="app" src="./"></iframe><script>
const out=document.getElementById('result');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
setTimeout(async()=>{
  try{
    const frame=document.getElementById('app'),d=frame.contentDocument,w=frame.contentWindow;
    const initialCards=[...d.querySelectorAll('.trip-card-v3')];
    const flagBoxes=[...d.querySelectorAll('.trip-card-v3 .trip-flag')];
    const imgs=[...d.querySelectorAll('.trip-card-v3 .trip-flag img.flag-img')];
    const letterGlyph=flagBoxes.some(el=>/^(AU|PH|US|JP|DE|TH|FR|BE|NL|PL|TR|CN|KR|HK|VN)$/i.test(el.textContent.trim()));
    const dimensions=imgs.every(img=>{const r=img.getBoundingClientRect();return r.width>=50&&r.height>=30});
    const loaded=imgs.length>=2&&imgs.slice(0,2).every(img=>img.complete&&img.naturalWidth>0);
    const initialStarts=initialCards.map(c=>c.dataset.start).filter(Boolean);
    const initialChronological=initialStarts.every((v,i)=>i===0||initialStarts[i-1]>=v);
    const routeCount=Number(d.querySelector('#allRouteMap')?.dataset.routeCount||0);
    const flightPaths=d.querySelectorAll('#allRouteMap .route-flight').length;

    d.querySelector('[data-nav="trips"]')?.click(); await wait(350);
    const filterBar=!!d.querySelector('.trip-filter-bar'),quality=!!d.querySelector('.quality-panel');
    const tripCards=[...d.querySelectorAll('.trip-card-v3')],starts=tripCards.map(c=>c.dataset.start).filter(Boolean);
    const chronological=starts.every((v,i)=>i===0||starts[i-1]>=v);
    const thailandNotAheadOf2024=!starts.includes('2020-01-31')||starts.findIndex(v=>v==='2020-01-31')>starts.findIndex(v=>v.startsWith('2024-'));

    d.querySelector('[data-view-mode="timeline"]')?.click(); await wait(120);
    const timeline=!!d.querySelector('[data-year-timeline]');
    d.querySelector('[data-view-mode="calendar"]')?.click(); await wait(120);
    const calendar=!!d.querySelector('[data-trip-calendar]')&&d.querySelectorAll('.calendar-month').length===12;

    d.querySelector('[data-nav="passport"]')?.click(); await wait(250);
    const km=Number(d.querySelector('[data-flight-km]')?.dataset.flightKm||0),laps=Number(d.querySelector('[data-earth-laps]')?.dataset.earthLaps||0);
    const metrics=w.__tripOSMetrics||{};
    const flightOk=km>160000&&laps>4&&metrics.flights===37&&metrics.airlines===17&&metrics.airports===18;
    const photoDiscovery=!!d.querySelector('#discoverTripsFromPhotos');

    const ok=initialCards.length>=2&&imgs.length>=2&&!letterGlyph&&dimensions&&loaded&&initialChronological&&routeCount>=37&&flightPaths===37&&filterBar&&quality&&chronological&&thailandNotAheadOf2024&&timeline&&calendar&&flightOk&&photoDiscovery;
    out.textContent=ok?`VISUAL_SMOKE_PASS cards=${tripCards.length} flags=${imgs.length} routes=${routeCount} flights=${metrics.flights} km=${km} laps=${laps.toFixed(2)} order=${starts.join(',')}`:`VISUAL_SMOKE_FAIL cards=${tripCards.length} flags=${imgs.length} glyph=${letterGlyph} loaded=${loaded} initialOrder=${initialChronological} routes=${routeCount}/${flightPaths} filter=${filterBar} quality=${quality} chrono=${chronological} timeline=${timeline} calendar=${calendar} flightOk=${flightOk} photo=${photoDiscovery} km=${km} laps=${laps}`;
    document.body.dataset.result=ok?'pass':'fail';
  }catch(e){out.textContent='VISUAL_SMOKE_FAIL '+e;document.body.dataset.result='fail'}
},6500);
</script>
