<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#060b10" />
    <meta
      name="description"
      content="Visto Astra — 人生の旅を眺めるデジタル地球儀"
    />
    <title>Visto Astra · Your world, remembered</title>
    <link rel="stylesheet" href="./style.css?v=20260909c" />
    <link rel="stylesheet" href="./round-fix.css?v=20260909c" />
  </head>
  <body>
    <header>
      <a class="brand" href="../visto/" aria-label="Vistoへ戻る"
        ><span class="brand-symbol">v.</span
        ><span>VISTO <small>ASTRA</small></span></a
      >
      <div class="header-actions">
        <button id="library" class="text-button">
          <i data-lucide="notebook-tabs"></i><span>旅の記録</span></button
        ><button
          id="settings"
          class="icon-button"
          title="表示設定"
          aria-label="表示設定"
        >
          <i data-lucide="sliders-horizontal"></i>
        </button>
      </div>
    </header>
    <section class="identity">
      <p class="eyebrow">YOUR WORLD, REMEMBERED</p>
      <h1>旅した世界。</h1>
      <div class="stats">
        <button id="countries">
          <b id="country-count">—</b><span>国・地域</span></button
        ><button id="cities"><b id="city-count">—</b><span>都市</span></button
        ><button id="trips"><b id="trip-count">—</b><span>Trips</span></button>
      </div>
    </section>
    <main id="stage" aria-label="旅行履歴の3D地球儀">
      <div id="labels"></div>
      <div id="loading">
        <span class="loader"></span><span id="load-text">地球を読み込み中</span>
      </div>
      <div id="failure" hidden>
        <p>地球を読み込めませんでした。</p>
        <button onclick="location.reload()">再読み込み</button>
      </div>
    </main>
    <div class="view-tools">
      <button
        id="home"
        class="icon-button"
        aria-label="地球全体に戻る"
        title="地球全体に戻る"
      >
        <i data-lucide="orbit"></i></button
      ><button id="zoom-in" class="icon-button" aria-label="拡大" title="拡大">
        <i data-lucide="plus"></i></button
      ><button id="zoom-out" class="icon-button" aria-label="縮小" title="縮小">
        <i data-lucide="minus"></i>
      </button>
    </div>
    <div class="scene-caption">
      <span class="live-dot"></span><span id="scene-caption">すべての旅</span>
    </div>
    <section id="replay" aria-label="Travel Replay">
      <div class="replay-heading">
        <span class="eyebrow">TRAVEL REPLAY</span
        ><button id="all-time" class="subtle">全期間</button>
      </div>
      <div class="replay-main">
        <button id="play" class="play-button" aria-label="旅行履歴を再生">
          <i data-lucide="play"></i></button
        ><button id="current-trip" class="current-trip">
          <span id="replay-date">2020 — 2026</span
          ><strong id="replay-title">ひとつずつ、世界が広がる。</strong></button
        ><button id="speed" class="speed-button" aria-label="再生速度">
          1×
        </button>
      </div>
      <input
        id="scrubber"
        type="range"
        min="0"
        max="100"
        value="100"
        step="0.01"
        aria-label="旅行履歴の時点"
      />
      <div id="years" class="years"></div>
    </section>
    <section id="panel" aria-label="旅の詳細" hidden>
      <div class="panel-head">
        <div>
          <span id="panel-eyebrow" class="eyebrow"></span>
          <h2 id="panel-title"></h2>
        </div>
        <button id="close-panel" class="icon-button" aria-label="閉じる">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="panel-body"></div>
    </section>
    <footer>
      <span>EARTH OBSERVATORY</span
      ><button id="about">Astra 1.2.2 <i data-lucide="info"></i></button>
    </footer>
    <script src="../visto/history-seed.js"></script>
    <script src="../visto/flight-seed.js"></script>
    <script type="module" src="./app.js?v=20260909c"></script>
  </body>
</html>
